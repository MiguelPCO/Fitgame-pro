    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              primary: {
                DEFAULT: '#DC2626', // Red-600
                hover: '#B91C1C',   // Red-700
                glow: 'rgba(220, 38, 38, 0.5)'
              },
              background: {
                DEFAULT: '#0f172a', // Slate-950 (Rich Dark Blue-Grey)
                card: '#1e293b',    // Slate-800
                lighter: '#334155'  // Slate-700
              },
              text: {
                main: '#f8fafc',    // Slate-50
                muted: '#94a3b8'    // Slate-400
              }
            },
            backgroundImage: {
              'radial-gradient': 'radial-gradient(circle at top center, var(--tw-gradient-stops))',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0f172a;
        background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 60%);
        background-attachment: fixed;
        color: #f8fafc;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a; 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 4px;
        border: 2px solid #0f172a;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569; 
      }
      
      /* Input autofill fix for dark mode */
      input:-webkit-autofill,
      input:-webkit-autofill:hover, 
      input:-webkit-autofill:focus, 
      input:-webkit-autofill:active{
          -webkit-box-shadow: 0 0 0 30px #1e293b inset !important;
          -webkit-text-fill-color: white !important;
      }
    </style>
  <script type="importmap">

}
</script>
